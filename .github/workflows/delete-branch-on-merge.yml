name: Delete Branch on Merge

on:
  pull_request:
    types: [ closed ]
    branches:
      - master
      - development

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.merged == true
    steps:
      - name: Delete branch
        run: gh api repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }} -X DELETE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}